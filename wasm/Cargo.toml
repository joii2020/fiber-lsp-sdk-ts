[package]
name = "fiber-lsp-sdk-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
fiber-lsp-sdk = { git = "https://github.com/chenyukang/fiber", rev = "5da02c0d0843b5a690eb82a8cc915bf7b4438693" }
fiber-types = { git = "https://github.com/chenyukang/fiber", rev = "5da02c0d0843b5a690eb82a8cc915bf7b4438693", features = ["watchtower"] }
fiber-json-types = { git = "https://github.com/chenyukang/fiber", rev = "5da02c0d0843b5a690eb82a8cc915bf7b4438693", features = ["conversion", "watchtower"] }
bincode = "1.3.3"
ckb-types = "1"
ckb-jsonrpc-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
hex = "0.4"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "=0.4.76"
async-trait = "0.1"
zeroize = "1"

[profile.release]
opt-level = "s"
overflow-checks = true
lto = true
