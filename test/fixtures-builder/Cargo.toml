[package]
name = "fiber-lsp-sdk-fixtures"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
fiber-lsp-sdk = { git = "https://github.com/chenyukang/fiber", rev = "76307312e8de518c9a32074e6d16867c04de4f86" }
fiber-types = { git = "https://github.com/chenyukang/fiber", rev = "76307312e8de518c9a32074e6d16867c04de4f86", features = ["watchtower"] }
fiber-json-types = { git = "https://github.com/chenyukang/fiber", rev = "76307312e8de518c9a32074e6d16867c04de4f86", features = ["conversion", "watchtower"] }
ckb-types = "1"
ckb-jsonrpc-types = "1"
serde_json = { version = "1", features = ["arbitrary_precision"] }
hex = "0.4"
musig2 = { version = "0.2.4", features = ["secp256k1", "serde"] }
tokio = { version = "1", features = ["rt", "macros"] }
